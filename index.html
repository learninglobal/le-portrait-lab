<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Portrait Lab — Learninglobal</title><style>
:root{--orange:#e87524;--dark:#33261e;--cream:#fffaf3;--pale:#fff0df;--border:#ead8c5;--green:#276d45;--red:#a33e30}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(125deg,#a94312,#ef8d39);color:white;padding:26px max(18px,calc((100vw - 1050px)/2))}header h1{margin:0;font-size:clamp(28px,5vw,43px)}header p{margin:5px 0 0}.smile{display:inline-flex;border:2px solid white;border-radius:50%;width:40px;height:40px;align-items:center;justify-content:center;margin-right:9px;font-size:24px}main{max-width:1050px;margin:auto;padding:22px 16px 70px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.tabs button{flex:1;min-width:155px;background:white;color:var(--dark);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:left;font-weight:700;cursor:pointer}.tabs button.active{background:var(--orange);color:white;border-color:var(--orange)}.tabs small{display:block;font-weight:400;opacity:.85}.panel{background:white;border:1px solid var(--border);border-radius:18px;padding:clamp(16px,3vw,28px);box-shadow:0 7px 25px #6c3c1410}h2{margin:0 0 8px;font-size:26px}h3{margin:0 0 10px}p{margin:7px 0 12px}.hint{background:var(--pale);border-left:4px solid var(--orange);padding:12px 15px;border-radius:8px;margin:12px 0 20px}.question{border-top:1px solid var(--border);padding:18px 0}.question:first-child{border-top:0}.choices{display:grid;gap:8px;margin:12px 0}.choices button,.facepick button{border:1px solid #d8c8b7;background:#fffdf9;color:var(--dark);border-radius:11px;padding:12px;text-align:left;cursor:pointer;font:inherit}.choices button:hover,.facepick button:hover{border-color:var(--orange)}.choices button.selected{border:2px solid var(--orange);background:#fff0e1}.choices button.correct{border:2px solid var(--green);background:#e9f7ed}.choices button.wrong{border:2px solid var(--red);background:#fff0ee}.feedback{font-size:14px;margin:8px 0;font-weight:600}.ok{color:var(--green)}.bad{color:var(--red)}.btn{background:var(--orange);border:0;border-radius:10px;color:white;font-weight:700;padding:11px 17px;cursor:pointer}.btn.secondary{background:white;color:var(--orange);border:1px solid var(--orange)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.faces{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.face{background:#fff8ef;border:1px solid var(--border);border-radius:12px;padding:8px;text-align:center}.face svg{width:100%;max-width:180px;display:block;margin:auto}.face strong{font-size:15px}.facepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px;margin:12px 0}.facepick button{padding:5px;text-align:center}.facepick button.selected{border:3px solid var(--orange);background:var(--pale)}.facepick svg{width:100%;max-width:120px;display:block;margin:auto}.role{font-size:17px;background:#fff6eb;padding:15px;border-radius:12px}.progress{height:10px;background:#f1e5d7;border-radius:10px;overflow:hidden;margin:16px 0}.progress>div{height:100%;background:var(--orange);transition:width .2s}.passage{background:#fff8ed;border-left:4px solid #c97b3d;padding:18px;border-radius:10px;font-family:Georgia,serif;font-size:18px;line-height:1.75;margin:16px 0}.score{font-size:18px;font-weight:700}.note{font-size:13px;color:#6d5a4c}footer{text-align:center;color:#766355;font-size:13px;margin-top:30px}button:focus-visible{outline:3px solid #7139a5;outline-offset:2px}@media(max-width:520px){.tabs button{min-width:135px}.facepick{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1><span class="smile">☺</span> Le Portrait Lab</h1><p>Learninglobal · Lexique avancé B2–C1 · Observer, distinguer, interpréter</p></header><main><p>5 étapes progressives · Réponses vérifiées · Explications immédiates · Aucune rédaction libre</p><div class="tabs" id="tabs"></div><div class="panel" id="app" aria-live="polite"></div><footer>Learninglobal · Learn. Learn again. Learn better. · Activités et textes originaux</footer></main><script>
const DATA={"mot": [["Un visage très maigre, aux joues creuses, est un visage…", ["émacié", "joufflu", "bouffi"], "émacié", "« Émacié » évoque une maigreur extrême."], ["Des cheveux noirs et brillants peuvent être qualifiés de…", ["de jais", "grisonnants", "hâlés"], "de jais", "« De jais » qualifie un noir profond et brillant."], ["Une voix qui tremble sous l’effet de l’âge est…", ["chevrotante", "cristalline", "nasillarde"], "chevrotante", "« Chevrotante » signifie tremblante."], ["Des pommettes très visibles sont…", ["saillantes", "cernées", "pincées"], "saillantes", "« Saillantes » signifie proéminentes."], ["Une peau sèche, fine et ridée ressemble à du parchemin : elle est…", ["parcheminée", "veloutée", "laiteuse"], "parcheminée", "« Parcheminée » évoque la texture du parchemin."], ["Des cheveux dressés et désordonnés sont…", ["hirsutes", "soyeux", "gominés"], "hirsutes", "« Hirsutes » décrit des cheveux hérissés et indisciplinés."], ["Un nez dont la pointe remonte légèrement est…", ["retroussé", "aquilin", "busqué"], "retroussé", "« Retroussé » décrit une pointe relevée."], ["Une voix trop douce, presque hypocrite, est…", ["doucereuse", "grave", "rauque"], "doucereuse", "« Doucereuse » suggère une douceur affectée."]], "nuance": [["Après plusieurs nuits sans sommeil, ses yeux étaient ___ et son teint ___ .", ["cernés / blafard", "bridés / doré", "globuleux / hâlé"], "cernés / blafard", "Fatigue : cernes et pâleur."], ["Après une journée à la plage, son teint était ___, et non ___ de peur.", ["hâlé / livide", "livide / hâlé", "cireux / rubicond"], "hâlé / livide", "« Hâlé » : coloré par le soleil ; « livide » : extrêmement pâle."], ["L’enfant avait un visage ___ ; après la piqûre, sa joue était ___ .", ["poupin / bouffie", "émacié / veloutée", "buriné / soyeuse"], "poupin / bouffie", "« Poupin » évoque la rondeur enfantine ; « bouffi » un gonflement."], ["Le vieux marin avait le visage ___ par les années, tandis que le malade paraissait ___ .", ["buriné / décharné", "poupin / rubicond", "lisse / doré"], "buriné / décharné", "« Buriné » : marqué par le temps ; « décharné » : extrêmement maigre."], ["Sa voix était ___ à cause d’un rhume ; celle de la chanteuse restait ___ .", ["enrouée / cristalline", "cristalline / nasillarde", "doucereuse / criarde"], "enrouée / cristalline", "« Enrouée » : altérée ; « cristalline » : claire et pure."], ["Elle avait les cheveux ___, presque comme de la soie, et non ___ par le vent.", ["soyeux / ébouriffés", "hirsutes / soyeux", "gras / lisses"], "soyeux / ébouriffés", "« Soyeux » décrit la texture ; « ébouriffés » le désordre."]], "faces": [{"id": "A", "name": "Madeleine", "hair": "silver", "shape": "thin", "eyes": "narrow", "skin": "pale", "mouth": "thin", "extra": "lines", "desc": "Une femme au visage émacié et aux pommettes saillantes. Sa peau parcheminée, ses cheveux grisonnants et ses lèvres pincées lui donnent un air austère."}, {"id": "B", "name": "Nadir", "hair": "black", "shape": "angular", "eyes": "deep", "skin": "olive", "mouth": "full", "extra": "beard", "desc": "Un homme au visage anguleux, au nez aquilin et aux yeux enfoncés. Sa chevelure de jais et ses traits marqués attirent le regard."}, {"id": "C", "name": "Clara", "hair": "red", "shape": "round", "eyes": "almond", "skin": "warm", "mouth": "full", "extra": "freckles", "desc": "Une jeune femme au minois poupin, aux joues joufflues et au nez retroussé. Ses cheveux ébouriffés encadrent son visage."}, {"id": "D", "name": "Victor", "hair": "brown", "shape": "square", "eyes": "wide", "skin": "tan", "mouth": "thin", "extra": "lines", "desc": "Un homme au visage carré et buriné, au teint hâlé et aux sourcils broussailleux. Ses cheveux drus sont en bataille."}, {"id": "E", "name": "Élise", "hair": "black", "shape": "oval", "eyes": "almond", "skin": "dark", "mouth": "full", "extra": "none", "desc": "Une femme au visage harmonieux, aux yeux en amande et à la bouche pulpeuse. Sa peau veloutée et ses cheveux soyeux soulignent ses traits délicats."}, {"id": "F", "name": "Armand", "hair": "gray", "shape": "round", "eyes": "wide", "skin": "pink", "mouth": "thin", "extra": "none", "desc": "Un homme au visage bouffi, au teint rougeaud et aux yeux globuleux. Son double menton et ses cheveux clairsemés le rendent reconnaissable."}], "cast": [{"role": "Un capitaine ayant passé trente ans en mer", "brief": "Il faut un visage marqué par les intempéries, un teint coloré par le soleil et une allure robuste.", "correct": "D", "why": "Victor : visage buriné, teint hâlé, traits robustes."}, {"role": "Une aristocrate âgée et sévère", "brief": "On recherche des pommettes proéminentes, une peau fine marquée par le temps et une expression austère.", "correct": "A", "why": "Madeleine : pommettes saillantes, peau parcheminée, lèvres pincées."}, {"role": "Une jeune héroïne vive et espiègle", "brief": "Un visage enfantin, des joues rondes et un petit nez relevé conviendraient au personnage.", "correct": "C", "why": "Clara : minois poupin, joues joufflues, nez retroussé."}, {"role": "Un enquêteur mystérieux", "brief": "Un visage aux angles nets, des yeux profondément logés et un nez recourbé accentuent son mystère.", "correct": "B", "why": "Nadir : visage anguleux, yeux enfoncés, nez aquilin."}, {"role": "Une cantatrice élégante", "brief": "On privilégie des traits réguliers, une peau douce et des cheveux d’aspect soyeux.", "correct": "E", "why": "Élise : traits harmonieux, peau veloutée, cheveux soyeux."}], "objective": [{"s": "Le témoin doit décrire une personne pour qu’on puisse la reconnaître. Quelle phrase est la plus factuelle ?", "opts": ["Elle a les pommettes saillantes, les cheveux grisonnants et les lèvres fines.", "Elle a un visage inquiétant qui inspire la méfiance.", "Elle est sans doute froide et méprisante."], "ans": 0, "why": "Les traits visibles peuvent être vérifiés ; le caractère supposé ne le peut pas."}, {"s": "Quel énoncé contient surtout une interprétation subjective ?", "opts": ["Ses yeux sont enfoncés et son nez est aquilin.", "Son visage anguleux lui donne un air mystérieux.", "Ses cheveux noirs encadrent son visage."], "ans": 1, "why": "« Lui donne un air mystérieux » exprime une impression."}, {"s": "Choisis la reformulation neutre de « Il a une tête sinistre ».", "opts": ["Son visage est anguleux et ses traits sont marqués.", "Il a un visage menaçant et cruel.", "Il semble forcément dangereux."], "ans": 0, "why": "On remplace un jugement par des éléments observables."}, {"s": "Quelle phrase convient à un portrait littéraire assumant une impression ?", "opts": ["Son visage buriné semblait porter la mémoire de mille tempêtes.", "Il a deux yeux et un nez.", "Ses cheveux sont de couleur brune."], "ans": 0, "why": "L’image littéraire associe un détail concret à une interprétation."}, {"s": "Une description de police doit éviter…", "opts": ["une hypothèse sur la personnalité", "la couleur des cheveux", "la forme du visage"], "ans": 0, "why": "Une description d’identification privilégie les éléments observables."}, {"s": "Quelle phrase distingue clairement observation et impression ?", "opts": ["Ses yeux sont cernés ; ils lui donnent un air fatigué.", "Il est paresseux puisqu’il a les yeux cernés.", "Son visage prouve qu’il est malhonnête."], "ans": 0, "why": "La première partie observe ; la seconde signale une impression, sans la présenter comme une certitude."}], "literary": [{"title": "À la fenêtre — portrait romanesque", "txt": "Chaque matin, une femme se tenait derrière la vitre du café. Son visage émacié, aux pommettes saillantes, semblait taillé dans une pierre pâle. Des mèches grisonnantes encadraient ses tempes ; sa peau parcheminée racontait des années dont elle ne parlait jamais. Pourtant, lorsque le serveur prononçait son prénom, son regard s’éclairait d’une douceur inattendue.", "qs": [["Quel groupe reprend le mieux « visage émacié » ?", ["un visage décharné", "un visage joufflu", "un visage bouffi"], 0, "« Décharné » est proche de « émacié »."], ["Que suggère « peau parcheminée » ?", ["une peau fine et desséchée", "une peau veloutée", "une peau bronzée"], 0, "Le parchemin évoque une peau sèche et marquée."], ["Quelle opposition organise le portrait ?", ["une apparence austère et une douceur révélée", "une grande jeunesse et une vieillesse soudaine", "une voix grave et une voix aiguë"], 0, "Le regard introduit une douceur inattendue."]]}, {"title": "Le voyageur — portrait d’aventure", "txt": "L’homme entra dans l’auberge sans retirer son manteau. Il avait le teint hâlé, le front buriné et des cheveux hirsutes que le vent semblait avoir peignés à sa manière. Son nez aquilin dessinait une ligne ferme au-dessus d’une bouche pincée. Quand il demanda une chambre, sa voix rauque, presque éraillée, fit taire un instant les conversations.", "qs": [["Quel adjectif est le plus proche de « hirsutes » ?", ["ébouriffés", "soyeux", "gominés"], 0, "Des cheveux « hirsutes » sont hérissés et désordonnés."], ["Dans ce contexte, « buriné » signifie…", ["marqué par le temps et les intempéries", "gonflé par la fatigue", "lisse et sans rides"], 0, "« Buriné » évoque des traits profondément marqués."], ["Quel mot pourrait remplacer « rauque » ?", ["enrouée", "cristalline", "mélodieuse"], 0, "« Enrouée » est proche, même si les nuances diffèrent."]]}, {"title": "La réception — portrait de société", "txt": "Sous les lustres, Madame Valcourt avançait avec une lenteur étudiée. Sa chevelure de jais, soigneusement lissée, contrastait avec son teint d’albâtre. Ses traits réguliers auraient pu paraître immobiles si un sourire doucereux n’avait pas traversé son visage. Elle parlait d’une voix mélodieuse, mais ses compliments semblaient calculés avec une précision redoutable.", "qs": [["« De jais » renvoie à des cheveux…", ["d’un noir profond", "grisonnants", "roux et ébouriffés"], 0, "Le jais est associé à un noir intense."], ["Quel synonyme convient à « teint d’albâtre » ?", ["teint très pâle", "teint rougeaud", "teint cuivré"], 0, "L’albâtre évoque une blancheur prononcée."], ["Pourquoi le sourire est-il « doucereux » ?", ["Il paraît affecté ou peu sincère.", "Il est naturellement chaleureux.", "Il est presque invisible."], 0, "« Doucereux » peut suggérer une douceur artificielle."]]}]};
const stages=[['1. Le mot juste','QCM · lexique'],['2. Les nuances','QCM · contexte'],['3. Qui est-ce ?','Images et portraits'],['4. Casting','Rôles et visages'],['5. Décrire et lire','Objectif, subjectif, littérature']];
let stage=0,answers={},checked={},progress={};try{progress=JSON.parse(localStorage.getItem('portraitLabV3')||'{}')}catch(e){};
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function portrait(f){const skins={pale:'#f1d5c0',olive:'#c59a76',warm:'#efb994',tan:'#b9805c',dark:'#9c6547',pink:'#e6a48e'};const hairs={silver:'#9b9a9b',black:'#25212a',red:'#a95530',brown:'#523b2b',gray:'#b6b1a8'};let skin=skins[f.skin],hair=hairs[f.hair];let rx={thin:49,angular:60,round:72,square:64,oval:59}[f.shape];let jaw=f.shape==='square'?'M55 92 Q55 160 77 170 L143 170 Q165 160 165 92':'M50 90 Q45 165 110 179 Q175 165 170 90';let eyeY=f.eyes==='deep'?103:99;let eyeW=f.eyes==='narrow'?12:f.eyes==='wide'?20:16;return `<svg viewBox="0 0 220 230" role="img" aria-label="Portrait illustré de ${esc(f.name)}"><rect width="220" height="230" rx="16" fill="#f5e8d7"/><path d="M18 230 Q26 185 75 183 L145 183 Q194 185 202 230" fill="#6e766f"/><path d="M85 160 L85 197 Q110 216 135 197 L135 160" fill="${skin}"/><ellipse cx="110" cy="105" rx="${rx}" ry="76" fill="${skin}"/><path d="${jaw}" fill="${skin}"/><path d="M${110-rx} 91 Q${110-rx-8} 22 109 22 Q${110+rx+9} 20 ${110+rx} 92 L${110+rx-9} 72 Q125 42 102 54 Q75 43 ${110-rx+9} 75Z" fill="${hair}"/><path d="M${110-rx+20} ${eyeY-12} q14 -7 27 -2 M${110+rx-47} ${eyeY-14} q15 -6 28 0" stroke="${hair}" stroke-width="${f.extra==='lines'?5:3}" fill="none" stroke-linecap="round"/><ellipse cx="${110-32}" cy="${eyeY}" rx="${eyeW/2}" ry="${f.eyes==='narrow'?4:7}" fill="white"/><ellipse cx="${110+32}" cy="${eyeY}" rx="${eyeW/2}" ry="${f.eyes==='narrow'?4:7}" fill="white"/><circle cx="78" cy="${eyeY}" r="4" fill="#3b332d"/><circle cx="142" cy="${eyeY}" r="4" fill="#3b332d"/><path d="M110 103 q-7 26 -1 31 q8 5 14 -1" stroke="#966d59" stroke-width="2.6" fill="none"/><path d="M${f.mouth==='full'?91:97} 151 Q110 ${f.mouth==='full'?161:154} ${f.mouth==='full'?129:123} 151 Q110 ${f.mouth==='full'?167:157} ${f.mouth==='full'?91:97} 151" fill="#aa6c66"/>${f.extra==='lines'?'<path d="M64 123 l-8 6 M156 123 l8 6 M80 145 l-9 8 M140 145 l9 8" stroke="#a77d69" fill="none"/>':''}${f.extra==='freckles'?'<g fill="#ad704f"><circle cx="64" cy="130" r="2"/><circle cx="74" cy="133" r="2"/><circle cx="147" cy="130" r="2"/><circle cx="156" cy="133" r="2"/></g>':''}${f.extra==='beard'?'<path d="M66 146 Q80 195 110 193 Q143 193 154 146 Q135 172 110 176 Q85 172 66 146" fill="'+hair+'" opacity=".7"/>':''}</svg>`}
function faceCard(f){return `<div class="face">${portrait(f)}<strong>${f.id} · ${esc(f.name)}</strong></div>`}
function tabs(){ $('#tabs').innerHTML=stages.map((x,i)=>`<button class="${stage===i?'active':''}" onclick="go(${i})">${x[0]}<small>${x[1]} ${progress[i]!==undefined?'· ✓ '+progress[i]+'%':''}</small></button>`).join('')}
function go(i){stage=i;answers={};checked={};tabs();render();window.scrollTo({top:0,behavior:'smooth'})}
function choices(key,opts,correct,why){let chosen=answers[key],done=checked[key];return `<div class="choices">${opts.map((o,i)=>`<button ${done?'disabled':''} class="${chosen===i?'selected':''} ${done&&i===correct?'correct':''} ${done&&chosen===i&&i!==correct?'wrong':''}" onclick="pick('${key}',${i})">${esc(o)}</button>`).join('')}</div><button class="btn secondary" ${chosen===undefined||done?'disabled':''} onclick="verify('${key}',${correct})">Vérifier</button>${done?`<p class="feedback ${chosen===correct?'ok':'bad'}">${chosen===correct?'✓ Bonne réponse.':'✗ À revoir.'} ${esc(why)}</p>`:''}`}
function pick(key,i){answers[key]=i;render(false)}function verify(key,correct){checked[key]=true;render(false)}
function questionSet(items,prefix){return items.map((x,i)=>`<section class="question"><strong>${i+1}. ${esc(x[0])}</strong>${choices(prefix+i,x[1],x[2]===undefined?0:x[1].indexOf(x[2]),x[3])}</section>`).join('')}
function score(total,correctKeys){let done=correctKeys.filter(x=>checked[x.key]).length;let right=correctKeys.filter(x=>checked[x.key]&&answers[x.key]===x.ans).length;if(done===total){progress[stage]=Math.round(right/total*100);localStorage.setItem('portraitLabV3',JSON.stringify(progress))}return `<div class="progress"><div style="width:${done/total*100}%"></div></div><p class="score">${done}/${total} réponses vérifiées · ${right} correctes ${done===total?'· Étape terminée':''}</p>`}
function next(){return `<div class="actions"><button class="btn secondary" onclick="go(${stage})">Recommencer cette étape</button>${stage<4?`<button class="btn" onclick="go(${stage+1})">Étape suivante →</button>`:''}</div>`}
function render(scroll=false){tabs();let h='';if(stage<2){let items=stage===0?DATA.mot:DATA.nuance;h=`<h2>${stages[stage][0]}</h><div class="hint">${stage===0?'Choisis le terme le plus précis. Vérifie chaque réponse pour lire la nuance.':'Choisis les mots adaptés au contexte, pas seulement des synonymes approximatifs.'}</div>`+questionSet(items,'q')+score(items.length,items.map((x,i)=>({key:'q'+i,ans:x[1].indexOf(x[2])})))+next()}
if(stage===2){h=`<h2>3. Qui est-ce ?</h2><div class="hint">Observe les six portraits. Lis chaque description riche en lexique et associe-la au bon personnage. Les portraits restent visibles : tu peux comparer plusieurs indices avant de vérifier.</div><div class="faces">${DATA.faces.map(faceCard).join('')}</div>`;let order=[2,4,0,5,1,3];order.forEach((id,i)=>{let f=DATA.faces[id],key='f'+i;h+=`<section class="question"><strong>Portrait ${i+1}</strong><p>${esc(f.desc)}</p>${choices(key,DATA.faces.map(x=>x.id+' · '+x.name),id,'Indices : '+f.desc)}</section>`});h+=score(6,order.map((id,i)=>({key:'f'+i,ans:id})))+next()}
if(stage===3){h=`<h2>4. Casting : qui pour le rôle ?</h2><div class="hint">Tu es responsable du casting. Lis le rôle, puis le portrait physique recherché. Choisis parmi les six comédiens celui dont les caractéristiques correspondent le mieux. Les portraits sont stylisés : les indices décisifs figurent aussi dans les fiches.</div><div class="faces">${DATA.faces.map(f=>`<div class="face">${portrait(f)}<strong>${f.id} · ${esc(f.name)}</strong><p class="note">${esc(f.desc)}</p></div>`).join('')}</div>`;DATA.cast.forEach((x,i)=>{let ans=DATA.faces.findIndex(f=>f.id===x.correct);h+=`<section class="question"><h3>Rôle ${i+1} : ${esc(x.role)}</h3><div class="role">${esc(x.brief)}</div>${choices('c'+i,DATA.faces.map(f=>f.id+' · '+f.name),ans,x.why)}</section>`});h+=score(DATA.cast.length,DATA.cast.map((x,i)=>({key:'c'+i,ans:DATA.faces.findIndex(f=>f.id===x.correct)})))+next()}
if(stage===4){h=`<h2>5. Décrire et lire</h2><div class="hint"><strong>Partie A — Description objective ou subjective.</strong> Choisis la formulation adaptée à la situation. Une observation est vérifiable ; une interprétation exprime une impression. Les deux peuvent être utiles, mais pas dans les mêmes contextes.</div>`;DATA.objective.forEach((x,i)=>{h+=`<section class="question"><strong>${i+1}. ${esc(x.s)}</strong>${choices('o'+i,x.opts,x.ans,x.why)}</section>`});h+=`<div class="hint"><strong>Partie B — Portraits littéraires originaux.</strong> Lis chaque passage, inspiré des procédés du roman, du récit d’aventure et du portrait de société (sans reproduire d’œuvre existante). Les questions reformulent les expressions avec des synonymes : lis le sens, pas seulement les mots.</div>`;DATA.literary.forEach((x,j)=>{h+=`<section class="question"><h3>${esc(x.title)}</h3><div class="passage">${esc(x.txt)}</div>`;x.qs.forEach((q,i)=>{h+=`<div class="question"><strong>${i+1}. ${esc(q[0])}</strong>${choices('l'+j+'_'+i,q[1],q[2],q[3])}</div>`});h+='</section>'});let keys=DATA.objective.map((x,i)=>({key:'o'+i,ans:x.ans})).concat(DATA.literary.flatMap((x,j)=>x.qs.map((q,i)=>({key:'l'+j+'_'+i,ans:q[2]}))));h+=score(keys.length,keys)+next()}
$('#app').innerHTML=h}
render();
</script></body></html>
