<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learninglobal | Le défi B2</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8ef;color:#35251d;font:17px system-ui,sans-serif}header{background:#b94d0b;color:white;padding:30px 6%}header small{letter-spacing:2px}h1{margin:8px 0}main{max-width:1000px;margin:auto;padding:24px}nav{display:flex;flex-wrap:wrap;gap:8px}button,select{font:inherit;border-radius:10px;padding:10px;border:1px solid #e3b18c}button{cursor:pointer;background:#fff;color:#803709}button.active,button.primary{background:#b94d0b;color:white;border-color:#b94d0b}button:focus-visible,select:focus-visible{outline:3px solid #f5a348}article{background:white;border:1px solid #f0d5bd;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 12px #a45b1010}.q{padding:16px 0;border-bottom:1px solid #eee}select{max-width:100%;background:#fffaf5;margin:6px 0}.feedback{font-size:15px;margin-top:8px}.good{color:#17663c}.bad{color:#a32c20}progress{width:100%;accent-color:#d66b22;height:18px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#765d4d}footer{text-align:center;padding:25px}a{color:#9c410b}</style><header><small>☺ LEARNINGLOBAL · FRANÇAIS B2</small><h1>Le Portrait – Le défi B2</h1><div>Lexique avancé · 6 défis pour affiner vos descriptions</div></header><main><p>Choisissez une réponse pour chaque question, puis vérifiez vos réponses. Vous pouvez recommencer chaque défi.</p><div id="total"></div><progress id="progress" max="100" value="0"></progress><nav id="nav"></nav><article id="panel"></article></main><footer><a href="https://learninglobal.github.io/le-portrait-lab/">Continuer avec Le Portrait Lab</a> · Learn. Learn again. Learn better.</footer><script>
const Q=(p,a,o,e='')=>({p,a,o,e});
const sections=[
{t:'Expressions idiomatiques',d:'Corrigez les expressions en choisissant la formulation exacte.',q:[
Q('Je n’ai pas besoin d’un mètre pour savoir que cette planche mesure soixante centimètres : j’ai une règle dans l’œil.','le compas dans l’œil',['la règle dans l’œil','le compas dans l’œil','le mètre dans l’œil'],'Évaluer des dimensions avec précision.'),
Q('Le fait de le voir rougir quand il m’a expliqué les prétendues raisons de son retard m’a mis le pou à l’oreille.','la puce à l’oreille',['la puce à l’oreille','le pou à l’oreille','la mouche à l’oreille'],'Éveiller les soupçons.'),
Q('Mathilde a réussi à copier sur sa voisine au nez et à la moustache du professeur de mathématiques.','au nez et à la barbe',['au nez et à la barbe','au nez et à la moustache','aux yeux et à la barbe'],'Sous les yeux de quelqu’un, sans qu’il intervienne.'),
Q('Malgré son âge, mon grand-père a encore bon pied bonne tête.','bon pied bon œil',['bon pied bonne tête','bon pied bon œil','bon œil bonne tête'],'Être encore en bonne forme.'),
Q('Ce chien a été très bien dressé : il obéit au doigt et à la baguette.','au doigt et à l’œil',['au doigt et à la baguette','au doigt et à l’œil','à l’œil et à la main'],'Obéir sans discuter.')]},
{t:'Les adjectifs du visage',d:'Associez chaque nom à l’adjectif qui convient. Puis choisissez sa forme accordée.',q:[...[
['des tempes','grisonnant','grisonnantes'],['des traits','irrégulier','irréguliers'],['une bouche','pincé','pincée'],['un nez','épaté','épaté'],['des yeux','globuleux','globuleux'],['des cheveux','clairsemé','clairsemés'],['une peau','flétri','flétrie'],['des lèvres','pulpeux','pulpeuses']].flatMap(([n,a,b])=>[Q(n+' : quel adjectif ?',a,['épaté','grisonnant','irrégulier','pincé','flétri','pulpeux','clairsemé','globuleux']),Q(n+' : choisissez la forme accordée.',b,[...new Set([b,a,a+'s',a+'e',a+'es'])])])]},
{t:'Les antonymes',d:'Retrouvez les couples d’antonymes.',q:[...[
['dru','épars'],['émacié','bouffi'],['charnu','mince'],['enfoncé','saillant'],['rugueux','velouté'],['mat','clair'],['anguleux','boursouflé'],['imberbe','barbu']].map(([p,a])=>Q(p,a,['mince','saillant','épars','bouffi','barbu','velouté','clair','boursouflé']))]},
{t:'Les synonymes',d:'Remplacez le groupe entre guillemets par un synonyme adapté au contexte.',q:[
Q('Ses cheveux « sans éclat » tombaient de chaque côté de ses pommettes proéminentes.','ternes',['ternes','soyeux','drus']),Q('Ses cheveux sans éclat tombaient de chaque côté de ses pommettes « proéminentes ».','saillantes',['saillantes','enfoncées','flétries']),Q('Ses « gros » yeux brillaient sous une arcade de sourcils drus.','globuleux',['globuleux','cernés','enfoncés']),Q('Ses gros yeux brillaient sous une arcade de sourcils « drus ».','épais',['épais','clairsemés','épars']),Q('Ses sourcils se rejoignaient presque à la racine d’un nez « large et court ».','épaté',['épaté','aquilin','grec']),Q('Son nez « busqué » domine une bouche aux lèvres épaisses.','aquilin',['aquilin','camus','retroussé']),Q('Son nez busqué domine une bouche aux lèvres « épaisses ».','charnues',['charnues','pincées','fines']),Q('Son visage « très ridé par la vie » plaisait encore aux femmes.','buriné',['buriné','poupin','bouffi']),Q('Son visage très ridé par la vie mais aux traits « réguliers » plaisait encore aux femmes.','harmonieux',['harmonieux','irréguliers','épais']),Q('Son visage « décharné », parcheminé et livide trahissait l’avancée de la maladie.','émacié',['émacié','joufflu','rubicond']),Q('Son visage décharné, « parcheminé » et livide trahissait l’avancée de la maladie.','très ridé et sec',['très ridé et sec','lisse et doux','gonflé']),Q('Son visage décharné, parcheminé et « livide » trahissait l’avancée de la maladie.','extrêmement pâle',['extrêmement pâle','doré','rougeaud'])]},
{t:'De l’adjectif au nom',d:'Choisissez la reformulation nominale dans un registre plus soutenu. Exemple : une peau blanche → la blancheur de la peau.',q:[Q('une peau douce','la douceur de la peau',['la douceur de la peau','la dureté de la peau','le doux de la peau']),Q('des cheveux soyeux','le soyeux des cheveux',['le soyeux des cheveux','la soie des cheveux','la sécheresse des cheveux']),Q('des joues rondes','la rondeur des joues',['la rondeur des joues','le rond des joues','la rotonde des joues']),Q('des lèvres parfaitement dessinées','le dessin parfait des lèvres',['le dessin parfait des lèvres','la perfection des lèvres dessinant','la dessination des lèvres']),Q('des traits réguliers','la régularité des traits',['la régularité des traits','la régulation des traits','le règlement des traits']),Q('une peau veloutée','le velouté de la peau',['le velouté de la peau','la veloutée de la peau','le velours de la peau'])]},
{t:'Les métaphores',d:'Choisissez le nom qui complète la métaphore.',q:[...[
['un regard passionné : un regard de …','braise'],['un teint très blanc : un teint de …','porcelaine'],['une peau très douce : une peau de …','pêche'],['une chevelure rousse : une chevelure de …','feu'],['des cheveux noirs : des cheveux d’…','ébène'],['des cheveux noirs : des cheveux de …','jais'],['un œil très perçant : un œil de …','lynx'],['des cheveux blonds : des cheveux d’…','or'],['des cheveux ébouriffés : des cheveux en …','bataille']].map(([p,a])=>Q(p,a,['jais','pêche','or','feu','bataille','lynx','braise','porcelaine','ébène']))]}
];
let current=0;const answers=sections.map(s=>s.q.map(()=>''));const checked=sections.map(()=>false);const $=id=>document.getElementById(id);const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function score(i){return sections[i].q.filter((q,j)=>answers[i][j]===q.a).length}function update(){let n=sections.reduce((a,s)=>a+s.q.length,0),v=sections.reduce((a,s,i)=>a+(checked[i]?score(i):0),0);$('total').textContent=`Score validé : ${v} / ${n} · ${checked.filter(Boolean).length} / 6 défis vérifiés`;$('progress').value=100*v/n;$('nav').innerHTML=sections.map((s,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})">${i+1}. ${s.t}${checked[i]?' ✓':''}</button>`).join('')}
function go(i){current=i;render()}function render(){update();let s=sections[current];$('panel').innerHTML=`<h2>${current+1}. ${s.t}</h2><p class="muted">${s.d}</p>`+s.q.map((q,j)=>`<div class="q"><label for="q${j}">${j+1}. ${esc(q.p)}</label><br><select id="q${j}" onchange="change(${j},this.value)"><option value="">Choisissez…</option>${q.o.map(o=>`<option value="${esc(o)}" ${answers[current][j]===o?'selected':''}>${esc(o)}</option>`).join('')}</select><div class="feedback ${answers[current][j]===q.a?'good':'bad'}">${checked[current]?(answers[current][j]===q.a?'✓ Correct !':'Réponse : '+esc(q.a))+(q.e?' — '+esc(q.e):''):''}</div></div>`).join('')+`<p id="result" aria-live="polite">${checked[current]?`Résultat : ${score(current)} / ${s.q.length}`:''}</p><div class="bar"><button class="primary" onclick="verify()">Vérifier</button><button onclick="reset()">Recommencer</button>${current<5?'<button onclick="go(current+1)">Défi suivant →</button>':''}</div>`}
function change(j,v){answers[current][j]=v;if(checked[current]){checked[current]=false;render()}}function verify(){if(answers[current].some(a=>!a)){ $('result').textContent='Répondez à toutes les questions avant de vérifier.';return}checked[current]=true;render()}function reset(){answers[current].fill('');checked[current]=false;render()}render();
</script></html>
